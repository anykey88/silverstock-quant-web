name: Deploy SilverStock to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 锁定与本地一致的 Flutter 3.0.0（Dart 2.17），避免新版移除 html renderer 导致构建失败
      - name: Setup Flutter 3.0.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.0.0'
          channel: stable
          cache: true

      - name: Resolve base href
        id: base
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPO/" >> "$GITHUB_OUTPUT"
          fi

      - name: Pub get
        run: flutter pub get

      - name: Build web
        run: |
          flutter build web --release \
            --web-renderer html \
            --base-href "${{ steps.base.outputs.path }}"

      - name: Post-process
        run: |
          # 防止 Jekyll 处理静态资源
          touch build/web/.nojekyll
          # 保留 SPA 深链接：任何 404 都回 index.html
          cp build/web/index.html build/web/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
