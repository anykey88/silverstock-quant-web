name: Daily Scan

# 每個交易日收盤後（台北時間 14:30 = UTC 06:30）掃描候選池，
# 產出 assets/data/daily_picks.json 並提交回 main。
# main 的提交會自動觸發 deploy-pages，所以網站上的名單當天就會更新。

on:
  schedule:
    # 週一至週五 06:30 UTC = 14:30 台北
    - cron: '30 6 * * 1-5'
  workflow_dispatch:
    inputs:
      limit:
        description: '只掃前 N 檔（留空掃全部）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.0.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.0.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 財報快取 30 天有效、當日行情快取 1 天，用 cache 保存可省下大半請求量
      - name: Restore scan cache
        uses: actions/cache@v4
        with:
          path: tool/v2/cache
          # 每次 run 新建 key，但用 restore-keys 繼承上一次的內容
          key: scan-cache-${{ github.run_id }}
          restore-keys: |
            scan-cache-

      - name: Run daily scan
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -n "$LIMIT" ]; then
            dart run tool/v2_scan.dart --limit "$LIMIT" --delay 3000 --out assets/data/daily_picks.json
          else
            dart run tool/v2_scan.dart --delay 3000 --out assets/data/daily_picks.json
          fi

      - name: Commit result
        run: |
          git config user.name "silverstock-bot"
          git config user.email "bot@users.noreply.github.com"
          git add assets/data/daily_picks.json
          if git diff --staged --quiet; then
            echo "名單無變化，不提交"
          else
            git commit -m "chore(scan): 每日掃描 $(date -u '+%Y-%m-%d')"
            git push
          fi

      - name: Write job summary
        if: always()
        run: python3 tool/v2/report_summary.py --format md >> $GITHUB_STEP_SUMMARY

      # 可選：推到微信（PushPlus 免費版即可）。
      # 在 repo secrets 設 PUSHPLUS_TOKEN 才會執行，沒設就跳過。
      - name: Push to WeChat
        if: always()
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python3 tool/v2/report_summary.py --format push
