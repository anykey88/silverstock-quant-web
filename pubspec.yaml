name: silverstock_quant_web
description: SilverStock-Quant-Web — 面向台胞银发存股族的台股多 Agent 量化研究网页工具（WorkBuddy 1024 造物挑战参赛作品）
publish_to: 'none'
version: 2.7.0+27

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    # 建置期由 tools/fetch_snapshot.py 自 FinMind 公開 API 取得的真實歷史資料快照。
    # 僅供本次參賽 Demo 使用；商業化必須採購 FinMind 商業授權，禁止直接把免費 API 用於售賣。
    - assets/data/snapshot.json
    - assets/data/stock_index.json
    - assets/data/daily_picks.json
    - assets/data/recommendations.json
    - assets/data/margin.json
    - assets/data/live.json
    - assets/data/family_lists.json
